<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Storm Sweep</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0F0F11; color: #F0F0F0; font: 16px/1.5 system-ui, -apple-system, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  h1 { font-size: 28px; letter-spacing: .04em; margin: 0 0 8px; }
  p { color: #C9C9CE; margin: 0 0 20px; }
  button { height: 48px; padding: 0 24px; border: 0; border-radius: 10px; background: #2E86C1; color: #fff; font-weight: 700; font-size: 16px; }
</style>
</head>
<body>
<main>
  <h1>NO SIGNAL</h1>
  <p>Shelters often block cell signal. Step outside or wait a moment — your checklist and photos save once you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
